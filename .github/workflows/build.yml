name: Build mt76 testmode modules

# 在 GitHub 云端编译，不需要本地 Linux 环境。
# 触发方式：Actions 页面点 "Run workflow"，或者 push 到 main。
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

# 新一轮 push 直接取消上一轮，避免同时跑两份白烧额度
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: 取出仓库
        uses: actions/checkout@v4

      - name: 释放磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      /usr/share/swift /opt/az /usr/local/.ghcup 2>/dev/null || true
          sudo apt-get clean
          echo "=== 清理后磁盘 ==="
          df -h /

      - name: 安装编译依赖
        run: bash build.sh deps

      - name: 拉 OpenWrt 源码
        run: bash build.sh source

      - name: 生成配置（打开 CONFIG_NL80211_TESTMODE）
        run: bash build.sh config

      - name: 编译
        run: |
          echo "=== 编译前磁盘 ==="
          df -h /
          set +e
          bash build.sh build
          rc=$?
          echo "=== 编译返回码: $rc ==="
          echo "=== 编译后磁盘 ==="
          df -h /
          if [ $rc -ne 0 ] && [ -f build.log ]; then
            echo "=== build.log 最后的错误 ==="
            grep -n -iE "error|no space|killed|failed" build.log | tail -40 || true
            echo "=== build.log 尾部 60 行 ==="
            tail -60 build.log
          fi
          exit $rc

      - name: 收集产物
        if: always()
        run: bash build.sh collect || true

      - name: 列出产物
        if: always()
        run: |
          echo "=== out/ 目录 ==="
          ls -la out/ 2>/dev/null || echo "(空)"
          echo "=== 尝试从 build_dir 直接找 .ko ==="
          find openwrt/build_dir -name "mt7915e.ko" -o -name "mt76.ko" -o -name "cfg80211.ko" 2>/dev/null | head

      - name: 自检 struct module 大小
        if: always()
        run: |
          echo "=== .config 里的 KALLSYMS ==="
          grep -n 'KALLSYMS' openwrt/.config 2>/dev/null || echo "(没找到)"
          echo
          echo "=== 内核实际配置（生成后）==="
          find openwrt/build_dir -name '.config' -path '*linux*' 2>/dev/null | head -1 | xargs -r grep -n 'KALLSYMS' 2>/dev/null || true
          echo
          if ls out/*.ko >/dev/null 2>&1; then
            echo "=== 本次收集到的模块 ==="
            ls -la out/*.ko
            python3 tool/ko_check.py out/*.ko
          else
            echo "(out/ 里没有 .ko，跳过)"
          fi

      - name: 上传产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mt76-testmode-modules
          path: out/
          if-no-files-found: warn
          retention-days: 30

      - name: 上传编译日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 14
