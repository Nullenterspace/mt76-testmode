name: Build mt76 testmode modules

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4

      - name: 释放磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          sudo apt-get clean
          df -h /

      - name: 安装编译依赖
        run: bash build.sh deps

      - name: 拉 OpenWrt 源码
        run: bash build.sh source

      - name: 生成配置（打开 CONFIG_NL80211_TESTMODE）
        run: bash build.sh config

      - name: 编译
        run: bash build.sh build

      - name: 收集产物
        if: always()
        run: bash build.sh collect || true

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: mt76-testmode-modules
          path: out/
          if-no-files-found: warn
          retention-days: 30

      - name: 上传编译日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
